version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: express_ecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: express_ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d express_ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Express Node.js API Service (Node 22)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_ecommerce_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/express_ecommerce?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
